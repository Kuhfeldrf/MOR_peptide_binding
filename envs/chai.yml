# Stage 2 only: Chai-1 co-folding.
#
# Isolated because chai_lab's torch build requires numpy<2, which conflicts
# with every conda-forge package in the main environment. This is a real
# dependency conflict, not a solver artefact, and it will recur on any port.
# See docs/arch_notes.md.
#
# Deliberately minimal: nothing is added here that the main env can do instead.
name: mor-chai
channels:
  - conda-forge
dependencies:
  - python=3.12
  - numpy<2             # forced by chai_lab -> torch 2.6.0+cu124
  # Templates. chai_lab shells out to `kalign` to realign a template hit onto
  # the query and aborts without it ("kalign is required for templates, but was
  # not found in PATH"). It is NOT a chai_lab dependency, so nothing pulls it
  # in. It was originally installed by hand into the built environment, which
  # meant a fresh clone could not run template mode and a rebuild of the env
  # would have silently dropped it.
  - kalign3
  - pip
  - pip:
      - chai_lab        # requires Linux, CUDA GPU with bfloat16
