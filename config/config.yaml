paths:
  data: data
  results: results
  scripts: scripts
  logs: logs
project:
  name: mor-peptide-pilot
  root: /scratch/kuhfeldr-Kuhfeld_temp
  profile: production
receptor:
  primary_pdb: 6DDF
  alternates:
  - 8F7Q
  keep_chain: R
  strip_entities:
  - Gi heterotrimer
  - nanobody
  - scFv16
  ph: 7.4
  inspect_protonation:
  - D147
  - H297
  model_missing_loops: true
  critical_loop: ECL2
  extract_ligands:
    DAMGO:
      entity: 5
      components:
      - TYR
      - DAL
      - GLY
      - MEA
      - ETA
      net_charge: 1
  resid_offset: 64
library:
  min_length: 4
  max_length: 20
  min_id_score: 0.0
  deduplicate: true
  reference_set: data/reference/reference_peptides.tsv
  ms_input: data/ms/example_peptides.tsv
cofold:
  tool: chai-1
  exclude:
  - DAMGO
  use_msa: false
  n_seeds: 5
  retain_full_ensemble: true
  metrics:
  - iptm
  - iplddt
  - ipsae
  - aggregate_score
  - pae
  cross_seed_agreement: true
  num_trunk_recycles: 3
  num_diffn_timesteps: 200
overlap:
  high_identity: 0.9
  moderate_identity: 0.6
membrane:
  builder: packmol-memgen
  output_format: amber
  forcefield:
    protein: ff19SB
    lipid: lipid21
    ligand: gaff2
    water: opc
  verify_conversion: true
  lipids:
  - POPC
  - CHL1
  lipid_ratio: '7:3'
  boundary_dist: 18
  water_layer: 22.5
  cholesterol_fraction: 0.3
  ionic_strength_mM: 150
  cation: Na+
  apl_offset: 1.15
  neutralise: true
  orientation: OPM/PPM
  expected_atoms:
  - 100000
  - 150000
md:
  engine: gromacs
  temperature_K: 310
  peptides: benchmark
  restraint_stages:
  - 1000
  - 500
  - 100
  - 10
  proximal_cutoff: 12.0
  production_ns: 50
  staged_restraint_release: true
  reduced_traj_ps: 100
  full_traj_ps: 5000
mmgbsa:
  purpose: rank_ordering
  stride: 10
abfe:
  peptides:
  - DAMGO
  start_from: experimental
  reference_structure: results/00_receptor/damgo_ref.pdb
  n_lambda_windows: 36
  ns_per_window: 5
  estimator: MBAR
  ligand_forcefield: gaff2
  ligand_charges: am1bcc
  save_full_trajectories: false
  subsample_stride: 50
benchmark:
  reference_set: data/reference/reference_peptides.tsv
  include_column: benchmark_include
  metrics:
  - spearman
  - mae
  stratify_by: overlap_flag
  report_separately:
  - cofold_confidence
  - physics_scores
test_overrides:
  cofold:
    n_seeds: 2
  md:
    production_ns: 1
  abfe:
    n_lambda_windows: 8
    ns_per_window: 0.2
