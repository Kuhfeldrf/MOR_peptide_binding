paths:
  data: data
  results: results
  scripts: scripts
  logs: logs
project:
  name: mor-peptide-pilot
  root: /scratch/kuhfeldr-Kuhfeld_temp
  profile: production
receptor:
  primary_pdb: 6DDF
  alternates:
  - 8F7Q
  keep_chain: R
  strip_entities:
  - Gi heterotrimer
  - nanobody
  - scFv16
  ph: 7.4
  inspect_protonation:
  - D147
  - H297
  model_missing_loops: true
  critical_loop: ECL2
  extract_ligands:
    DAMGO:
      entity: 5
      components:
      - TYR
      - DAL
      - GLY
      - MEA
      - ETA
      net_charge: 1
  resid_offset: 64
  # Poses that arrive in a different experimental receptor's numbering need
  # their own offset. 8F7Q (human MOR + FLAG tag) runs uniformly +2 against
  # the 6DDF-based mOR_clean: D3.32 is Asp149 there and Asp147 here.
  # Verified by fit RMSD, not by shared-residue count - the wrong offset still
  # matches 280 of 281 CA but fits at 5.57 A against 1.06 A for the right one.
  pose_offset_overrides:
    metenk_hdk: -2
    metenk_exp: -2
library:
  # Scrambled decoys are the negative control: one matched permutation per real
  # peptide. They co-fold (Stage 2) and stop there - carrying no affinity data,
  # they never enter the expensive stages.
  include_scrambles: true
  min_length: 4
  max_length: 20
  min_id_score: 0.0
  deduplicate: true
  reference_set: data/reference/reference_peptides.tsv
  ms_input: data/ms/example_peptides.tsv
  screening_set: data/reference/known_opioid_peptides.csv
cofold:
  tool: chai-1
  # Chai-1 writes the receptor as chain A and the peptide as chain B. Stage 3
  # needs the receptor chain to relate the prediction's frame to the crystal's.
  receptor_chain: A
  exclude:
  - DAMGO
  use_msa: false
  n_seeds: 5
  retain_full_ensemble: true
  metrics:
  - iptm
  - iplddt
  - ipsae
  - aggregate_score
  - pae
  cross_seed_agreement: true
  num_trunk_recycles: 3
  num_diffn_timesteps: 200
overlap:
  high_identity: 0.9
  moderate_identity: 0.6
membrane:
  builder: packmol-memgen
  output_format: amber
  forcefield:
    protein: ff19SB
    lipid: lipid21
    ligand: gaff2
    water: opc
  verify_conversion: true
  lipids:
  - POPC
  - CHL1
  lipid_ratio: '7:3'
  boundary_dist: 18
  water_layer: 22.5
  cholesterol_fraction: 0.3
  ionic_strength_mM: 150
  cation: Na+
  apl_offset: 1.15
  # Packing iterations. NOT defaults: packmol-memgen defaults to 100/20, but the
  # DAMGO system that ran 50 ns of production MD was packed with 200/40. Leaving
  # these implicit meant the workflow could not reproduce the configuration
  # behind its own validated result (see docs/packing_calibration.md).
  nloop_all: 200
  nloop: 40
  neutralise: true
  orientation: OPM/PPM
  expected_atoms:
  - 100000
  - 150000
md:
  engine: gromacs
  temperature_K: 310
  # Met-enkephalin pose-stability campaign: the same peptide from four
  # independent starting poses, plus its scramble. The three predicted poses
  # answer whether independent pose generators converge under unrestrained
  # physics; metenk_exp sets the scale for what "stable" looks like for a pose
  # that is known to be right; metenk_scr tests whether staying bound
  # discriminates a binder at all. Without the last two the run cannot be read
  # - every method already places every peptide in the pocket, and MM/GBSA on
  # these same complexes scored decoys BETTER than real peptides (AUROC 0.483).
  peptides:
  - metenk_chai
  - metenk_ptx
  - metenk_hdk
  - metenk_exp
  - metenk_scr
  # Poses staged by hand into results/02_cofold/<name>/, with no Stage 2 seeds
  # behind them. metenk_chai and metenk_scr are copies of the Chai-1 best poses
  # for met-enkephalin and its scramble, renamed so all five systems are built
  # identically rather than one being inherited from an earlier packing run.
  prestaged_poses:
  - metenk_chai
  - metenk_ptx
  - metenk_hdk
  - metenk_exp
  - metenk_scr
  restraint_stages:
  - 1000
  - 500
  - 100
  - 10
  proximal_cutoff: 12.0
  production_ns: 100
  # config/prod.mdp is left at the 50 ns setting that produced the validated
  # DAMGO trajectory; this campaign runs the 100 ns copy instead.
  prod_mdp: config/prod100.mdp
  staged_restraint_release: true
  reduced_traj_ps: 100
  full_traj_ps: 5000
mmgbsa:
  purpose: rank_ordering
  # Scored from a MINIMISED COMPLEX, not a trajectory, so the tier is cheap
  # enough to run over the scrambled decoys. A triage score that cannot be run
  # over negatives cannot be validated.
  igb: 8                 # GBn2, the AmberTools pairing for mbondi3 radii
  minsteps: 2000
  disulfide: "140,217"   # TM3-ECL2, receptor numbering
  stride: 10             # retained for the trajectory-ensemble variant
abfe:
  peptides:
  - DAMGO
  start_from: experimental
  reference_structure: results/00_receptor/damgo_ref.pdb
  n_lambda_windows: 36
  ns_per_window: 5
  estimator: MBAR
  ligand_forcefield: gaff2
  ligand_charges: am1bcc
  save_full_trajectories: false
  subsample_stride: 50
benchmark:
  reference_set: data/reference/reference_peptides.tsv
  include_column: benchmark_include
  metrics:
  - spearman
  - mae
  stratify_by: overlap_flag
  report_separately:
  - cofold_confidence
  - physics_scores
  assay_filter: GPI
test_overrides:
  cofold:
    n_seeds: 2
  md:
    production_ns: 1
  abfe:
    n_lambda_windows: 8
    ns_per_window: 0.2
