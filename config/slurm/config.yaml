# Snakemake SLURM executor profile for ORCA (PSU ARC).
#
# GPUs are requested through the plugin's own gres key: it rejects --gres
# inside slurm_extra, and that rejection only appears at submission time,
# so a dry run does not catch it.
#
# Rule names here must match the workflow. An earlier version referenced
# cofold_chai and abfe_windows, which no longer exist after the refactor, so
# those resource requests silently did not apply - a stale profile fails quietly
# rather than erroring.

executor: slurm
# Concurrent SLURM jobs. Sized to the hardware rather than picked round:
# a node is 64 CPU / 570 GB / 4 GPUs, so a GPU rule packs 4 per node (its
# 8 CPU and 64 GB are far from binding), and `short` alone holds 16 idle
# nodes = 64 free GPUs. At 12 the workflow left ~60 GPUs idle and co-folded
# 185 seed jobs a dozen at a time.
#
# 48 keeps the widest stage saturated without taking the whole partition on a
# shared machine. It does not affect the expensive stages, which are limited by
# peptide count (7 MD jobs) rather than by this number.
jobs: 48
latency-wait: 60             # NFS: wait for outputs to appear
rerun-incomplete: true
printshellcmds: true
keep-going: true             # one peptide failing must not stop the rest

use-conda: true
conda-prefix: /scratch/kuhfeldr-Kuhfeld_temp/.snakemake-conda

default-resources:
  slurm_partition: "short"
  runtime: 120               # minutes
  mem_mb: 16000
  cpus_per_task: 4

set-resources:
  # Stage 2: one GPU per inference. L40S and A30 both have bfloat16, which is
  # Chai-1's hard requirement.
  cofold_seed:
    slurm_partition: "short"
    gres: "gpu:1"
    runtime: 120
    mem_mb: 64000
    cpus_per_task: 8

  # Stage 3: packmol is CPU-bound and slow; give it room and a long walltime.
  membrane_pack:
    slurm_partition: "normal"
    runtime: 720
    mem_mb: 64000
    cpus_per_task: 8

  membrane_topology:
    runtime: 120
    mem_mb: 32000

  # Stage 4: every MD stage needs a GPU.
  md_minimise:
    gres: "gpu:1"
    runtime: 90
    mem_mb: 32000
    cpus_per_task: 8
  md_heat:
    gres: "gpu:1"
    runtime: 120
    mem_mb: 32000
    cpus_per_task: 8
  # 240 min is exactly `short`'s 4 h ceiling, leaving no margin at all, so
  # equilibration runs in `normal` (24 h) instead.
  md_equilibrate:
    slurm_partition: "normal"
    gres: "gpu:1"
    runtime: 240
    mem_mb: 32000
    cpus_per_task: 8

  # `long` contains ONLY A30 nodes. The 50 ns DAMGO benchmark - 8 h 43 m,
  # 137.7 ns/day - was an A30 for that reason, not a deliberate choice.
  # `normal` holds the L40S nodes and still allows 24 h, nearly 3x that run,
  # so production goes there and asks for an L40S specifically.
  #
  # The L40S is expected to be the faster card for this workload, but that is
  # an expectation and not a measurement: 137.7 ns/day is the A30 number, and
  # the first L40S run is what will show the real difference.
  md_production:
    slurm_partition: "normal"
    gres: "gpu:l40s:1"
    runtime: 1200
    mem_mb: 32000
    cpus_per_task: 8

  # Stage 6: each lambda window is its own job.
  abfe_window:
    slurm_partition: "long"
    gres: "gpu:1"
    runtime: 720
    mem_mb: 32000
    cpus_per_task: 8
